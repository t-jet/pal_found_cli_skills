name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout skills
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: pal_found_cli_skills

      - name: Checkout CLI parser source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: t-jet/pal_found_cli_tool
          ref: a3a38ec434fdb046c329b850e716dc541fa87ecd
          path: pal_found_cli_tool
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install validators
        run: python -m pip install pytest ruff ./pal_found_cli_tool "foundry-platform-sdk==1.101.0"

      - name: Run validation
        working-directory: pal_found_cli_skills
        run: |
          ruff check tests
          pytest -q
